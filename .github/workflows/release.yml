name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            signing_identity: "-"
          - platform: windows-latest
            args: ""
            signing_identity: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Build and attach release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clipdeck ${{ github.ref_name }}"
          releaseBody: "Automated Clipdeck build. macOS signing/notarization is not yet production-configured."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
